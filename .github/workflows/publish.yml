name: Publish to Marketplace

# Uses Marketplace Trusted Publishing (OIDC), so no token or secret is stored.
# The publisher's Trusted Publishing policy must name this file: publish.yml.
# Run it from the Actions tab, or push a tag like v1.0.2 after bumping package.json.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

concurrency: marketplace-publish

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Publish (rebuilds themes via vscode:prepublish)
        run: npx --yes @vscode/vsce publish --oidc
